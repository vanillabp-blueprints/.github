name: Render organisation page
"on":
  push:
    branches:
      - main
    paths:
      - blueprints.yaml
      - bin/render_index.py
      - .github/workflows/render-index.yaml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-index
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pyyaml jsonschema
      - name: Validate blueprints.yaml
        run: python bin/validate_index.py
      - name: Render profile/README.md
        run: python bin/render_index.py
      - name: Commit the rendered page
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "profile/README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "docs: render the organisation page from blueprints.yaml"
          git push

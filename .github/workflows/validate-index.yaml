name: Validate blueprints index
"on":
  push:
    paths:
      - blueprints.yaml
      - blueprints.schema.json
      - bin/validate_index.py
      - bin/render_index.py
      - profile/README.md
      - .github/workflows/validate-index.yaml
  pull_request:
    paths:
      - blueprints.yaml
      - blueprints.schema.json
      - bin/validate_index.py
      - bin/render_index.py
      - profile/README.md
      - .github/workflows/validate-index.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pyyaml jsonschema
      - name: Validate blueprints.yaml
        run: python bin/validate_index.py
      - name: Check that the organisation page has been rendered
        # On main the page is rendered and committed by render-index.yaml, so only
        # pull requests have to bring it along themselves.
        if: github.event_name == 'pull_request'
        run: python bin/render_index.py --check

name: Validate blueprints index
"on":
  push:
    paths:
      - blueprints.yaml
      - blueprints.schema.json
      - bin/validate_index.py
      - .github/workflows/validate-index.yaml
  pull_request:
    paths:
      - blueprints.yaml
      - blueprints.schema.json
      - bin/validate_index.py
      - .github/workflows/validate-index.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pyyaml jsonschema
      - name: Validate blueprints.yaml
        run: python bin/validate_index.py

        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-audited-aggregate-quarkus/main/AGENTS.md

  - id: persistence-active-record
    title: Aggregates without a repository
    summary: >
      The workflow aggregate is the only class on the persistence path: no repository, no
      persistence code of the application, no configuration. VanillaBP recognises the idiom of
      each aggregate itself, and says which one it found while the application is built. So one
      workflow module holds a JPA aggregate and a MongoDB one side by side.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa, mongodb]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Quarkus-integration
    platforms:
      # The first blueprint which cannot exist for both platforms. An aggregate which stores
      # itself is an idiom one of them does not have. That is an answer, not a gap, so it
      # does not say 'planned'.
      springboot:
        status: not-applicable
        reason: Spring Boot has no active record idiom for entities.
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-active-record-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-active-record-quarkus/main/AGENTS.md


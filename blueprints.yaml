# The single source of truth about the VanillaBP blueprints.
#
# profile/README.md (the organisation page) is generated from this file. Do not edit the
# generated part of that file. AI agents read this file to pick the blueprints which match
# a BPMN they have to implement. That is what 'covers.bpmn' is for.
#
# Validated against blueprints.schema.json by .github/workflows/validate-index.yml.
#
# 'bpms' names what a blueprint is built and tested against. That is why no entry lists
# process-engine-api. That adapter is developed against a mock first and has no engine behind
# it, so a blueprint could not run a workflow on it. It comes back per entry once it can.
version: 2
blueprints:

  # ----------------------------------------------------------------------------------
  # Workflow module structure and runtime
  # ----------------------------------------------------------------------------------

  - id: module-single
    title: Application plus one workflow module
    summary: >
      The normal case, and the entry point into VanillaBP: an application module plus one
      workflow module packaged as a JAR. Includes the workflow module's own configuration
      files, an integration test against the workflow module and a smoke test of the
      application.
    category: module
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "ProcessService#startWorkflow"
    composes_with: [module-multi, module-packaging]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#defining-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-single-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-single-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-single-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-single-quarkus/main/AGENTS.md

  - id: module-multi
    title: Several workflow modules in one application
    summary: >
      An application module which pulls in several workflow module JARs. Shows how the modules
      stay independent of each other, how name clashes between them are avoided, and how they
      share code without coupling their processes: a library JAR, and the list of what must
      never be shared.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@BpmnProcess"
    composes_with: [module-interaction, module-packaging]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#how-name-clashes-are-avoided
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#building-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#defining-a-workflow-module
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-multi-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-multi-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-multi-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-multi-quarkus/main/AGENTS.md

  - id: module-standalone
    title: The application is the workflow module
    summary: >
      If it is clear that there will never be more than one workflow module, the application
      itself can be the workflow module. Zero configuration: adding the adapter dependency is
      all it takes.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
    composes_with: [showcase-standalone]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#do-i-need-to-define-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#zero-configuration-the-classpath-is-the-configuration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-standalone-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-standalone-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-standalone-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-standalone-quarkus/main/AGENTS.md

  - id: module-interaction
    title: Interaction between workflow modules
    summary: >
      Two workflow modules which interact without coupling their processes. The asking module
      calls an interface of a shared API JAR from a service task and waits at a message event.
      The answering module announces its result as an event, and a listener in the asking
      module correlates it as a BPMN message. Neither model knows the other module.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
        - bpmn:IntermediateCatchEvent
        - bpmn:MessageEventDefinition
      spi:
        - "ProcessService#correlateMessage"
    composes_with: [module-multi, bpmn-message-correlation, bpmn-async-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Message-correlation
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-interaction-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-interaction-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-interaction-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-interaction-quarkus/main/AGENTS.md

  - id: module-packaging
    title: Assembling a runtime from workflow modules, and shipping it
    summary: >
      An application which builds its runtime out of workflow modules it only gets as
      dependencies. Shows how their classes are found when they live in packages of their own,
      how their versions are pinned, what the modules configure and what the application
      overrides, and how the result is shipped as an executable artifact, a container image and
      a native build.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
    composes_with: [module-multi]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#building-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#runtime-considerations
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Quarkus#provide-index-for-workflow-modules
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#configuration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-packaging-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-packaging-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-packaging-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-packaging-quarkus/main/AGENTS.md

  - id: module-bpms-migration
    title: Migrating running workflows to another BPMS
    summary: >
      Two adapters configured side by side: new workflows start in the new BPMS, while running
      workflows are completed in the old one. Shows the adapter priorities down to the level of
      a single workflow.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        # The workflow waits at a message, and correlating it shows which adapter is asked
        # first. The message itself is bpmn-message-correlation.
        - bpmn:IntermediateCatchEvent
        - bpmn:MessageEventDefinition
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/BPMS-migration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#configure-the-adapters
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-bpms-migration-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-bpms-migration-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-bpms-migration-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-bpms-migration-quarkus/main/AGENTS.md

  - id: module-idle-application
    title: An idle application
    summary: >
      What an application costs its database while a workflow waits in a timer, and the two
      keys which bring that cost down to nothing. One says how long an outbox poller may rest.
      The other lets an embedded engine wait for the next due job instead of asking every few
      seconds. An endpoint counts the statements the database ran, so the saving is measured,
      not just claimed.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
        - bpmn:IntermediateCatchEvent
        - bpmn:TimerEventDefinition
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "ProcessService#startWorkflow"
    composes_with: [bpmn-timer, module-standalone]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Observability
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Running-more-than-one-node
      - https://github.com/vanillabp/adapter-platform-integration/wiki/BPMS-adapters
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-idle-application-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-idle-application-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-idle-application-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-idle-application-quarkus/main/AGENTS.md

  - id: module-simulator
    title: A simulator plays the systems around a workflow module
    summary: >
      One small application of its own plays every system a workflow module talks to: a credit
      rating over REST, an e-signature service which calls back, and the Business Cockpit
      through the dev shell simulator it extends. The application mocks nothing: the module
      knows the systems only through ports named after their roles, and a profile points the
      real adapters at the simulator or at the real systems. Integration tests only, driven
      through a test API which knows nothing about the workflow.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:UserTask
        - bpmn:ServiceTask
        - bpmn:IntermediateCatchEvent
        - bpmn:MessageEventDefinition
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "@TaskId"
        - "@UserTaskDetailsProvider"
        - "ProcessService#startWorkflow"
        - "ProcessService#completeUserTask"
        - "ProcessService#correlateMessage"
    composes_with: [module-single, bpmn-message-correlation, cockpit-user-task-backend]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#publishing-a-workflow-module-it-brings-its-own-wiring
      - https://github.com/vanillabp/business-cockpit/wiki/Connecting-a-workflow-module
      - https://github.com/vanillabp/business-cockpit/wiki/Developing-UI-components-locally#the-dev-shell-simulator
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-simulator-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-simulator-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-simulator-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-simulator-quarkus/main/AGENTS.md

  - id: module-under-load
    title: A workflow module under load
    summary: >
      A load driver plays customers, clerks and a neighbour system which answers late or not at
      all, as a load profile next to the BPMN says. It raises the load step by step, reads the
      meters the application publishes anyway, and names the pool which ran out first: the
      connections, the dispatch stage of the outbox, the execution slots of the adapter or the
      heap, with the setting to change. No load testing tool, and nothing measured in CI.
    category: module
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
        - bpmn:UserTask
        - bpmn:EventBasedGateway
        - bpmn:ExclusiveGateway
        - bpmn:IntermediateCatchEvent
        - bpmn:MessageEventDefinition
        - bpmn:TimerEventDefinition
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "@TaskId"
        - "@SyncWithBPMS"
        - "ProcessService#startWorkflow"
        - "ProcessService#correlateMessage"
        - "ProcessService#completeUserTask"
    composes_with: [module-idle-application, module-simulator, bpmn-message-correlation, bpmn-timer]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/The-pools-of-an-application
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Observability
      - https://github.com/vanillabp/adapter-platform-integration/wiki/What-VanillaBP-is-sized-for
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-under-load-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-under-load-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-under-load-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-under-load-quarkus/main/AGENTS.md

  - id: module-process-driver
    title: Scenarios bring a case to every point of its process
    summary: >
      For every point of the process there are scenarios which lead there. The simulator plays
      the environment and answers like the real systems; a process driver plays the users and
      brings a real loan approval to such a point through the GUI API of the module. A test
      checks the case there in every situation which matters: with a small or a large amount,
      signed, declined, or never answered. No test jumps into the engine, nothing in the
      application is mocked, and the knowledge of the process is in one place. The tests live in
      the workflow module and measure how much of it they reach; the driver lives in a Maven
      module of its own, which production never pulls.
    category: module
    base: module-simulator
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:UserTask
        - bpmn:ServiceTask
        - bpmn:ExclusiveGateway
        - bpmn:BoundaryEvent
        - bpmn:BoundaryEvent/bpmn:MessageEventDefinition
        - bpmn:MessageEventDefinition
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "@TaskId"
        - "@SyncWithBPMS"
        - "@UserTaskDetailsProvider"
        - "ProcessService#startWorkflow"
        - "ProcessService#completeUserTask"
        - "ProcessService#correlateMessage"
        - "@TaskEvent"
    composes_with: [module-simulator, bpmn-gateways, bpmn-user-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Message-correlation#a-message-which-comes-before-the-workflow-waits-for-it
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-process-driver-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-process-driver-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-process-driver-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-process-driver-quarkus/main/AGENTS.md

  # ----------------------------------------------------------------------------------
  # Persistence of workflow aggregates
  # ----------------------------------------------------------------------------------

  - id: persistence-mongodb
    title: Workflow aggregates in MongoDB
    summary: >
      The workflow aggregate stored in MongoDB instead of a relational database. This also
      changes the transaction outbox which starts workflows reliably.
    category: persistence
    base: module-single
    # Camunda 8 only: an embedded engine needs a relational database, and this blueprint has
    # none. That is what it is about. Running both anyway means that the engine and the
    # aggregate commit separately. That is a compromise, not something to show.
    bpms: [camunda8]
    persistence: [mongodb]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#configure-the-transaction-outbox
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-mongodb-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-mongodb-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-mongodb-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-mongodb-quarkus/main/AGENTS.md

  - id: persistence-custom
    title: A persistence of your own
    summary: >
      A reference implementation in memory. It shows what VanillaBP needs from a persistence
      technology it does not support out of the box.
    category: persistence
    base: module-single
    # Camunda 8 only: an embedded engine needs a relational database, and this blueprint has
    # none. That is what it is about. Running both anyway means that the engine and the
    # aggregate commit separately. That is a compromise, not something to show.
    bpms: [camunda8]
    persistence: [custom]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-custom-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-custom-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-custom-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-custom-quarkus/main/AGENTS.md

  - id: persistence-parallel-branches
    title: Two branches writing one aggregate
    summary: >
      What happens when two branches of one workflow write the same workflow aggregate at the
      same time, and the four ways out. One of them is shown as code, the others as the
      decision behind it.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ParallelGateway
        - bpmn:UserTask
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "ProcessService#completeUserTask"
    composes_with: [bpmn-boundary-events, bpmn-multi-instance-task, bpmn-call-activity-decomposition]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-parallel-branches-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-parallel-branches-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-parallel-branches-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-parallel-branches-quarkus/main/AGENTS.md

  - id: persistence-liquibase
    title: The application owns its database schema
    summary: >
      Liquibase creates every table the application needs, including the ones VanillaBP and the
      embedded engine would create themselves. Every workflow module brings its own changelog,
      and one changelog table tells the owners apart by the logical path of each changelog.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
    composes_with: [module-multi]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Quarkus-integration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-liquibase-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-liquibase-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-liquibase-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-liquibase-quarkus/main/AGENTS.md

  - id: persistence-flyway
    title: The application owns its database schema, with Flyway
    summary: >
      The same as persistence-liquibase with the other tool: versioned SQL migrations instead
      of changelogs, and nothing created at runtime. VanillaBP, each workflow module and the
      application each get a Flyway instance and a migration history of their own.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
    composes_with: [module-multi]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Quarkus-integration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-flyway-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-flyway-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-flyway-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-flyway-quarkus/main/AGENTS.md

  - id: persistence-audited-aggregate
    title: A workflow aggregate which remembers every change
    summary: >
      Hibernate Envers keeps every state the workflow aggregate ever had, with the person who
      caused it. An outbox entry which reports an event gets the aggregate as it was when the
      entry was planned, not as it is when the entry is sent.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
        - bpmn:UserTask
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "ProcessService#completeUserTask"
        - "AggregatePersistenceAware#getAuditingId"
        - "AggregatePersistenceAware#loadByIdAndAuditingId"
        - "PhaseTwoCall#askingForTheStateOfTheEvent"
        - "PhaseTwoOutbox#schedule"
    composes_with: [bpmn-user-task, persistence-liquibase, module-multi]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Integration-SPI
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-audited-aggregate-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-audited-aggregate-springboot/main/AGENTS.md

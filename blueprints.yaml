      spi: ["@WorkflowTask", "@TaskId", "ProcessService#completeUserTask", "ProcessService#correlateMessage", "@WorkflowDetailsProvider"]
    composes_with: [cockpit-workflow-details-frontend, cockpit-workflow-details-application]

        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.
      quarkus:
        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.
      react:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-process-driver-frontend-react
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-process-driver-frontend-react/main/AGENTS.md

  # Not tied to the cockpit: the patterns hold for any application with forms of its own. It is
  # in this category because the cockpit blueprints start on one platform and get their twins
  # later.
  - id: cockpit-usertasks-in-the-application
    title: User tasks in the application
    summary: >
      Every user task is a row of its own next to the workflow aggregate, so a task can be open
      several times at once. The content of its form is stored as JSON, and a saved draft stays
      in the task. The result reaches the aggregate when the task is completed, in the
      transaction which completes it in the BPMS. Each form endpoint is protected by an
      authority of the module. Use it instead of bpmn-user-task when a task is open more than
      once or its form keeps drafts.
    category: cockpit
    base: bpmn-user-task
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:UserTask
        - bpmn:ParallelGateway
        - bpmn:MultiInstanceLoopCharacteristics
        - bpmn:TerminateEventDefinition
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "@MultiInstanceElement"
        - "ProcessService#completeUserTask"
    composes_with: [bpmn-multi-instance-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#user-tasks
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#completing-and-canceling-asynchronous-tasks
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-usertasks-in-the-application-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-usertasks-in-the-application-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-usertasks-in-the-application-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-usertasks-in-the-application-quarkus/main/AGENTS.md

  # Builds on cockpit-usertasks-in-the-application, because many of the patterns hold for an
  # application with forms of its own as well.
  - id: cockpit-organizing-usertasks
    title: Organizing user tasks
    summary: >
      Describes each user task to the Business Cockpit so that the right people see it. The
      initiator is whoever caused the report, so nobody is notified about their own work.
      Candidate groups are the authorities which protect the forms. A task which belongs to one
      person gets an assignee. The user who did the previous step is an excluded candidate, the
      four-eyes principle. Each task chooses how the cockpit notifies, has a due date from the
      rules of the business, and may get a follow-up date. Titles and search texts come from
      templates, in several languages. Whoever worked on a task stays an admitted user and may
      read its form later. A task moves to other people by being ended and entered again.
    category: cockpit
    base: cockpit-usertasks-in-the-application
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:UserTask
        - bpmn:BoundaryEvent
        - bpmn:MessageEventDefinition
        - bpmn:BoundaryEvent/bpmn:MessageEventDefinition
      spi:
        - "@UserTaskDetailsProvider"
        - "@WorkflowDetailsProvider"
        - "PrefilledUserTaskDetails"
        - "NotificationDelivery"
        - "BusinessCockpitService#aggregateChanged"
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "ProcessService#correlateMessage"
        - "ProcessService#completeUserTask"
    composes_with: [cockpit-user-task-backend]
    docs:
      - https://github.com/vanillabp/business-cockpit/wiki/Reporting-workflows-and-user-tasks#organizing-user-tasks
      - https://github.com/vanillabp/business-cockpit/wiki/Reporting-workflows-and-user-tasks#who-caused-it-the-initiator
      - https://github.com/vanillabp/business-cockpit/wiki/Templates
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-organizing-usertasks-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-organizing-usertasks-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-organizing-usertasks-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-organizing-usertasks-quarkus/main/AGENTS.md


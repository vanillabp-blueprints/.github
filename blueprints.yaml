  - id: cockpit-header-extension-backend
    title: A button in the header of the Business Cockpit, backend
    summary: >
      The backend of a workflow module which puts a button into the header of the Business
      Cockpit, to start a process. A loan request which does not exist yet has no user task and
      no case page, so the header is the place for its start. The workflow module holds the
      OpenAPI of the start form behind the button and implements it: a POST which starts the
      process and answers with the id of the new loan request. A WorkflowModuleDetailsProvider

  # ----------------------------------------------------------------------------------
  # Business Cockpit
  # ----------------------------------------------------------------------------------

  # One workflow module with a user interface, cut into parts which each build with one tool:
  # the backend with Maven, a frontend per UI framework with npm, and the application or the
  # bundle with Maven again. A frontend has no Java platform, so it names its frameworks as
  # its platforms and says 'not-applicable' for Spring Boot and Quarkus.
  - id: cockpit-user-task-backend
    title: User tasks in the Business Cockpit, backend
    summary: >
      The backend of a workflow module whose user tasks the Business Cockpit shows. The
      workflow module carries the OpenAPI of its forms, which the frontends read through a git
      submodule, and implements it: two user tasks, a details provider which fills a column of
      the task list, and the configuration the cockpit needs. The integration test reports to
      the dev shell simulator of the cockpit and completes both tasks through the endpoints the
      forms call.
    category: cockpit
    base: bpmn-user-task
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
      bpmn: [bpmn:UserTask]
      spi: ["@WorkflowTask", "@TaskId", "ProcessService#completeUserTask", "@UserTaskDetailsProvider"]
    composes_with: [cockpit-user-task-frontend, cockpit-user-task-application, cockpit-user-task-bundle]
    docs:
      - https://github.com/vanillabp/business-cockpit/wiki/Connecting-a-workflow-module
      - https://github.com/vanillabp/business-cockpit/wiki/Reporting-workflows-and-user-tasks
      - https://github.com/vanillabp/business-cockpit/wiki/Configuration#what-a-workflow-module-tells-the-cockpit
      - https://github.com/vanillabp/business-cockpit/wiki/Developing-UI-components-locally#the-dev-shell-simulator
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-user-task-backend-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-user-task-backend-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-user-task-backend-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-user-task-backend-quarkus/main/AGENTS.md

  - id: cockpit-user-task-frontend
    title: User tasks in the Business Cockpit, forms
    summary: >
      The forms of the two user tasks of cockpit-user-task-backend, which the cockpit loads at
      runtime as micro-frontends. Built with npm alone into a UI JAR for a Java application and
      into an nginx image. The typed API client is generated from the OpenAPI file of the
      backend, which the frontend reads through a git submodule, and browser tests load the forms
      the way a cockpit does. Every framework uses the same test ids.
    category: cockpit
    covers:
      bpmn: [bpmn:UserTask]
      spi: [UserTaskForm, UserTaskList, defineBcElement]
    composes_with: [cockpit-user-task-backend, cockpit-user-task-application, cockpit-user-task-application-proxy]
    docs:
      - https://github.com/vanillabp/business-cockpit/wiki/User-task-forms-and-status-sites
      - https://github.com/vanillabp/business-cockpit/blob/main/skills/business-cockpit-creator/references/module-loading.md
      - https://github.com/vanillabp/business-cockpit-module-kit
    platforms:
      springboot:
        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.
      quarkus:
        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.

# The single source of truth about the VanillaBP blueprints.
#
# profile/README.md (the organisation page) is generated from this file - do not edit
# the generated part of that file. AI agents read this file to pick the blueprints
# matching a BPMN they have to implement, which is what 'covers.bpmn' is for.
#
# Validated against blueprints.schema.json by .github/workflows/validate-index.yml.
#
# 'bpms' names what a blueprint is built and tested against, which is why no entry lists
# process-engine-api: that adapter is developed mock-first and has no engine behind it, so a
# blueprint could not execute a workflow on it. It comes back per entry once it can.
version: 2
blueprints:

  # ----------------------------------------------------------------------------------
  # Workflow module structure and runtime
  # ----------------------------------------------------------------------------------

  - id: module-single
    title: Application plus one workflow module
    summary: >
      The normal case and the entry point into VanillaBP: an application module plus one
      workflow module packaged as a JAR, including the workflow module's own configuration
      files, an integration test against the workflow module and a smoke test of the
      application.
    category: module
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "ProcessService#startWorkflow"
    composes_with: [module-multi, module-packaging]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#defining-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-single-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-single-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-single-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-single-quarkus/main/AGENTS.md

  - id: module-multi
    title: Several workflow modules in one application
    summary: >
      An application module pulling in several workflow module JARs: how the modules stay
      independent of each other, how name clashes between them are avoided, and how they share
      code without coupling their processes - a library JAR, and the list of what must never be
      shared.
    category: module
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@BpmnProcess"
    composes_with: [module-interaction, module-packaging]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#how-name-clashes-are-avoided
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#building-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#defining-a-workflow-module
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-multi-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-multi-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-multi-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-multi-quarkus/main/AGENTS.md

  - id: module-standalone
    title: The application is the workflow module
    summary: >
      If it is clear that there will never be more than one workflow module, the
      application itself can be the workflow module. Zero configuration - adding the
      adapter dependency is all it takes.
    category: module
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
    composes_with: [showcase-standalone]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#do-i-need-to-define-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#zero-configuration-the-classpath-is-the-configuration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-standalone-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-standalone-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-standalone-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-standalone-quarkus/main/AGENTS.md

  - id: module-interaction
    title: Interaction between workflow modules
    summary: >
      Two workflow modules interacting without coupling their processes: the outgoing
      module sends a BPMN message which is translated into an internal API call, the
      incoming module waits for a message delivered by its own API. Shown as an
      alternative: an asynchronous service task completed by a callback.
    category: module
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:IntermediateThrowEvent
        - bpmn:IntermediateCatchEvent
        - bpmn:SendTask
      spi:
        - "ProcessService#correlateMessage"
        - "ProcessService#completeTask"
        - "@TaskId"
    composes_with: [module-multi, bpmn-message-correlation, bpmn-async-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Message-correlation
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#completing-and-canceling-asynchronous-tasks
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-interaction-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-interaction-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-interaction-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-interaction-quarkus/main/AGENTS.md

  - id: module-packaging
    title: Assembling a runtime from workflow modules, and shipping it
    summary: >
      An application which composes its runtime out of workflow modules it only gets as
      dependencies: how their classes are discovered when they live in packages of their own,
      how their versions are pinned, what the modules configure and what the application
      overrides, and how the result is shipped as an executable artifact, a container image and
      a native build.
    category: module
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
    composes_with: [module-multi]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#building-a-workflow-module
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Spring-Boot#runtime-considerations
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules-in-Quarkus#provide-index-for-workflow-modules
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-modules#configuration
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-packaging-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-packaging-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/module-packaging-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/module-packaging-quarkus/main/AGENTS.md

  - id: module-bpms-migration
    title: Migrating running workflows to another BPMS
    summary: >
      Two adapters configured in parallel: new workflows start in the new BPMS while
      running workflows are completed in the old one. Shows the adapter priorities down to
      the level of a single workflow.
    category: module
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/BPMS-migration
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#configure-the-adapters
    platforms:
      springboot:
        status: planned
      quarkus:
        status: planned

  # ----------------------------------------------------------------------------------
  # Persistence of workflow aggregates
  # ----------------------------------------------------------------------------------

  - id: persistence-mongodb
    title: Workflow aggregates in MongoDB
    summary: >
      The workflow aggregate persisted in MongoDB instead of a relational database, which
      also changes the transaction outbox used to start workflows reliably.
    category: persistence
    base: module-single
    # Camunda 8 only: an embedded engine needs a relational database, and this blueprint has
    # none - that is what it is about. Running both anyway means the engine and the aggregate
    # commit separately, which is a compromise rather than something to show.
    bpms: [camunda8]
    persistence: [mongodb]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Spring-Boot-integration#configure-the-transaction-outbox
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-mongodb-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-mongodb-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-mongodb-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-mongodb-quarkus/main/AGENTS.md

  - id: persistence-custom
    title: A persistence of your own
    summary: >
      An in-memory reference implementation showing what VanillaBP needs from a
      persistence technology it does not support out of the box.
    category: persistence
    base: module-single
    # Camunda 8 only: an embedded engine needs a relational database, and this blueprint has
    # none - that is what it is about. Running both anyway means the engine and the aggregate
    # commit separately, which is a compromise rather than something to show.
    bpms: [camunda8]
    persistence: [custom]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-custom-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-custom-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-custom-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-custom-quarkus/main/AGENTS.md

  - id: persistence-parallel-branches
    title: Two branches writing one aggregate
    summary: >
      What happens when two branches of one workflow write the same workflow aggregate at
      the same time, and the four ways out - one of them shown as code, the others as the
      decision behind it.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ParallelGateway
        - bpmn:UserTask
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "ProcessService#completeUserTask"
    composes_with: [bpmn-boundary-events, bpmn-multi-instance-task, bpmn-call-activity-decomposition]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-parallel-branches-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-parallel-branches-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-parallel-branches-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-parallel-branches-quarkus/main/AGENTS.md

  - id: persistence-active-record
    title: Aggregates without a repository
    summary: >
      The workflow aggregate is the only class on the persistence path: no repository, no
      persistence of the application's own, no configuration. VanillaBP recognises the idiom
      of each aggregate itself and says which one it found while the application is built,
      so one workflow module holds a JPA aggregate and a MongoDB one side by side.
    category: persistence
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa, mongodb]
    covers:
      bpmn: []
      spi:
        - "@WorkflowService"
        - "@WorkflowTask"
        - "ProcessService#startWorkflow"
    composes_with: [module-single]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates#persistence-technologies-supported
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Quarkus-integration
    platforms:
      # The first blueprint which cannot exist for both platforms: an aggregate storing
      # itself is an idiom one of them does not have. That is an answer and not a gap,
      # which is why it does not say 'planned'.
      springboot:
        status: not-applicable
        reason: Spring Boot has no active record idiom for entities.
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/persistence-active-record-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/persistence-active-record-quarkus/main/AGENTS.md

  # ----------------------------------------------------------------------------------
  # BPMN scenarios
  # ----------------------------------------------------------------------------------

  - id: bpmn-service-task
    title: Service tasks
    summary: >
      A service task calling business code, including what happens when the handler
      throws, how the BPMS retries and where the transaction boundaries are.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:ServiceTask
      spi:
        - "@WorkflowTask"
        - "@TaskParam"
        - "TaskException"
    composes_with: [bpmn-error-escalation, bpmn-gateways]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#the-execution-contract
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#what-happens-when-my-handler-throws
      - https://github.com/vanillabp/spi-for-java#wire-up-a-task
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-service-task-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-service-task-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-service-task-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-service-task-quarkus/main/AGENTS.md

  - id: bpmn-user-task
    title: User tasks
    summary: >
      A user task is created, its task ID is stored in the workflow aggregate and the task
      is later completed or canceled through the API.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:UserTask
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "ProcessService#completeUserTask"
        - "ProcessService#cancelUserTask"
    composes_with: [bpmn-boundary-events, bpmn-async-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#user-tasks
      - https://github.com/vanillabp/spi-for-java#user-tasks-and-asynchronous-tasks
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-user-task-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-user-task-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-user-task-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-user-task-quarkus/main/AGENTS.md

  - id: bpmn-async-task
    title: Asynchronous tasks
    summary: >
      Tasks which are not user tasks but still complete asynchronously - the handler
      returns immediately and the task is completed once the surrounding system answers.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        # A receive task waits for a BPMN message and is completed by correlating one,
        # which is bpmn-message-correlation. This blueprint shows the task that stays open
        # until the application completes it by its id.
        - bpmn:SendTask
      spi:
        - "@WorkflowTask"
        - "@TaskId"
        - "@TaskEvent"
        - "ProcessService#completeTask"
        - "ProcessService#cancelTask"
    composes_with: [bpmn-user-task, bpmn-boundary-events, module-interaction]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#completing-and-canceling-asynchronous-tasks
      - https://github.com/vanillabp/spi-for-java#user-tasks-and-asynchronous-tasks
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-async-task-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-async-task-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-async-task-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-async-task-quarkus/main/AGENTS.md

  - id: bpmn-message-correlation
    title: Messages for running workflows
    summary: >
      Delivering a message to a running workflow, how the workflow is found, what a
      correlation ID is needed for and why message handling has to be idempotent.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:IntermediateCatchEvent
        - bpmn:MessageEventDefinition
      spi:
        - "ProcessService#correlateMessage"
        - "@WorkflowService"
    composes_with: [bpmn-message-start, bpmn-boundary-events, module-interaction]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Message-correlation
      - https://github.com/vanillabp/spi-for-java#correlate-an-incoming-message
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-message-correlation-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-message-correlation-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-message-correlation-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-message-correlation-quarkus/main/AGENTS.md

  - id: bpmn-message-start
    title: Starting a workflow by message
    summary: >
      A workflow started by a message instead of an explicit call, and what that means for
      the workflow aggregate.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:StartEvent
        - bpmn:MessageEventDefinition
      spi:
        - "ProcessService#startWorkflowByMessage"
    composes_with: [bpmn-message-correlation]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Message-correlation#starting-a-workflow-by-message
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-message-start-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-message-start-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-message-start-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-message-start-quarkus/main/AGENTS.md

  # The three blueprints below show features which are being built right now. Their
  # documentation link is the wiki itself until the page describing the feature exists.
  - id: bpmn-bpms-initiated-start
    title: Workflows the BPMS starts
    summary: >
      A workflow the engine starts on its own, triggered by a timer or a signal. Nobody
      called startWorkflow, so the workflow aggregate comes into being on the way in.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:StartEvent
        - bpmn:TimerEventDefinition
        - bpmn:SignalEventDefinition
      spi:
        - "@WorkflowStartedByBpms"
    composes_with: [bpmn-timer, bpmn-signals]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Starting-workflows#the-bpms-starts-it
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-aggregates
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-bpms-initiated-start-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-bpms-initiated-start-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-bpms-initiated-start-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-bpms-initiated-start-quarkus/main/AGENTS.md

  - id: bpmn-timer
    title: Timers
    summary: >
      Timer events in the sequence flow and as boundary events, and how a workflow reacts
      to a timer having fired.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:IntermediateCatchEvent
        - bpmn:BoundaryEvent
        - bpmn:TimerEventDefinition
      spi:
        - "@WorkflowTask"
        - "@TaskEvent"
    composes_with: [bpmn-boundary-events, bpmn-user-task]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki/Workflow-tasks#completing-and-canceling-asynchronous-tasks
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-timer-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-timer-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-timer-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-timer-quarkus/main/AGENTS.md

  - id: bpmn-signals
    title: Signals
    summary: >
      A signal broadcast by the application and caught elsewhere in the same or another
      workflow, including what a broadcast means for workflows nobody addressed.
    category: bpmn
    base: module-single
    bpms: [camunda7, camunda8]
    persistence: [jpa]
    covers:
      bpmn:
        - bpmn:SignalEventDefinition
        - bpmn:IntermediateCatchEvent
      spi:
        - "ProcessService#sendSignal"
    composes_with: [bpmn-bpms-initiated-start, bpmn-boundary-events]
    docs:
      - https://github.com/vanillabp/adapter-platform-integration/wiki
    platforms:
      springboot:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-signals-springboot
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-signals-springboot/main/AGENTS.md
      quarkus:
        status: available
        repo: https://github.com/vanillabp-blueprints/bpmn-signals-quarkus
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/bpmn-signals-quarkus/main/AGENTS.md

  - id: bpmn-workflow-ended
    title: Learning that a workflow ended
    summary: >
      How an application is told that a workflow reached its end, without modelling a
      service task in front of every end event.
    category: bpmn

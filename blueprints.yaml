  - id: cockpit-header-extension-frontend
    title: A button in the header of the Business Cockpit, button and start form
    summary: >
      The button "Request a loan" of cockpit-header-extension-backend for the header of the
      cockpit, and the start form it opens in a dialog of the cockpit. A data entry Header of the
      module's own names the button, and bc-check-entries checks it with --data-entry Header. A
      cockpit without a header ignores the entry, and the module works there without the button.
      Built with npm alone into a UI JAR and an nginx image, with browser tests in the host of the
      module kit: with a header and without, and next to a module without a header part.
    category: cockpit
    covers:
      bpmn: []
      spi: [Header, defineBcElement, openDialog, closeDialog]
    composes_with: [cockpit-header-extension-backend, cockpit-header-extension-application]
    docs:
      - https://github.com/vanillabp/business-cockpit/blob/main/skills/business-cockpit-creator/references/module-loading.md#the-other-extension-points
      - https://github.com/vanillabp/business-cockpit-module-kit
    platforms:
      springboot:
        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.
      quarkus:
        status: not-applicable
        reason: A frontend runs in the browser and is built with npm, not on a Java platform.
      react:
        status: available
        repo: https://github.com/vanillabp-blueprints/cockpit-header-extension-frontend-react
        agents_md: https://raw.githubusercontent.com/vanillabp-blueprints/cockpit-header-extension-frontend-react/main/AGENTS.md

  - id: cockpit-header-extension-application
    title: A button in the header of the Business Cockpit, application
    summary: >
      The application which runs the workflow module of cockpit-header-extension-backend and
      serves the UI JAR of its frontend. A smoke test boots it, asks for the manifest and starts a
      loan approval through the endpoint of the start form. A Docker Compose file starts it next to
      a cockpit, with one user who sees the module and one who does not.
    category: cockpit
    bpms: [camunda7, camunda8, operaton, cibseven]
    persistence: [jpa]
    covers:
